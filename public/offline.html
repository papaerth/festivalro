<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오프라인 · 축제로</title>
    <link rel="icon" href="/icon.svg" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
        background: #f6f8f8;
        color: #1b2b2a;
        padding: 24px;
      }
      .box {
        text-align: center;
        max-width: 380px;
      }
      .logo {
        width: 68px;
        height: 68px;
        margin: 0 auto 18px;
        display: block;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 15px; line-height: 1.6; color: #4a5a59; margin: 0 0 4px; }
      .en { font-size: 13px; color: #8a9a99; margin-top: 6px; }
      button {
        margin-top: 22px;
        padding: 11px 22px;
        border: none;
        border-radius: 10px;
        background: #1e8e85;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
      }
      button:hover { filter: brightness(0.96); }
    </style>
  </head>
  <body>
    <div class="box">
      <img class="logo" src="/icon.svg" alt="축제로" />
      <h1>인터넷 연결을 확인해주세요</h1>
      <p>지금은 오프라인 상태예요. 연결이 돌아오면 새로고침해 주세요.</p>
      <p class="en">You’re offline. Please check your connection and try again.</p>
      <button onclick="location.reload()">다시 시도 · Retry</button>
    </div>
  </body>
</html>
